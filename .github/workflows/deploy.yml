name: Deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
      
            echo "===== IDENTITY ====="
            whoami
            id
      
            echo "===== SUDO ====="
            sudo -n -l
      
            echo "===== RESTART ====="
            sudo -n /usr/bin/systemctl restart night-frontier
      
            echo "===== STATUS ====="
            sudo -n /usr/bin/systemctl --no-pager --full status night-frontier
